# MaskChain quickstart — OpenAI path.
# Mounted as 99-config-runtime.yaml, loaded after config-base.yaml.
# Requires OPENAI_KEY in examples/quickstart/.env.

routing:
  providers:
    - name: openai
      api_type: openai
      base_url: "https://api.openai.com"
      api_keys:
        - "${OPENAI_KEY}"
      timeout: 60s
      priority: 1

  rules:
    - tenant: default
      routes:
        - model: "gpt-4o-mini"
          providers: ["openai"]

shield:
  action_on_suspicious: mask

tenants:
  default:
    name: "Default Tenant"
    auth_header: "Authorization"
    api_keys:
      - "sk-test-default"
    pii_config:
      enabled: true
      default_action: mask
      rules:
        - label: email
          type: regex
          pattern: EMAIL
          action: mask
        - label: phone
          type: regex
          pattern: PHONE
          action: mask
        - label: ssn
          type: regex
          pattern: SSN
          action: mask

analytics:
  cost_rates:
    - model: "gpt-4o-mini"
      input_price_per_1k: 0.00015
      output_price_per_1k: 0.0006
